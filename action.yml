name: Setup Swift
description: Setup a Swift environment on Ubuntu or macOS
author: Frederik Wallner
inputs:
  swift-version:
    description: Swift version to configure
    required: true
    default: "latest"
  skip-verify-signature:
    description: Skip GPG signature verification where applicable
    default: false
outputs:
  version:
    description: The installed Swift release version or resolved dated snapshot identifier
runs:
  using: node24
  main: dist/index.js
branding:
  icon: "command"
  color: "orange"
